[package]
name = "garudabot"
version = "0.2.5"
description = "An Education Platform for Games, IoT, and AI."
authors = ["garudabot"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
log = "0.4"

serde = "1.0.228"
serde_json = "1.0.149"

tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

firmata-rs = "0.4.3"
serialport = "4.3.0"
